version: '3.8'

services:
  setx-events:
    build: .
    container_name: setx-events
    ports:
      - "3001:3001"  # API
      - "8081:8081"  # Frontend
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
