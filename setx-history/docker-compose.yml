version: '3.8'

services:
  setx-history:
    build: .
    container_name: setx-history
    ports:
      - "3002:3002"
    environment:
      - OLLAMA_URL=https://ollama.com
      - OLLAMA_API_KEY=6f15669254714b3782a3ca496f117335.Rdkn59O-KUskGeWjfiVux3OQ
      - OLLAMA_MODEL=gpt-oss:20b-cloud
    volumes:
      - ./database.sqlite:/app/database.sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
